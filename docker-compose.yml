services:
  db:
    image: postgres:16-alpine
    container_name: skylagring-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skylagring
    ports:
      - "5432:5432"
    volumes:
      - skylagring-pgdata:/var/lib/postgresql/data

volumes:
  skylagring-pgdata:
